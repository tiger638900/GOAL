<!DOCTYPE html>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 24px;
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 8px;
    }
    p.desc {
      color: #8b949e;
      margin-bottom: 24px;
    }
    .task-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #21262d;
      padding-bottom: 8px;
    }
    .task-title {
      font-size: 18px;
      font-weight: 600;
      color: #f0f6fc;
    }
    .btn-download {
      background: #238636;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-download:hover {
      background: #2ea043;
    }
    .kanban-board {
      display: flex;
      gap: 16px;
      background: #010409;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid #30363d;
    }
    .kanban-column {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      width: 280px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
    }
    .column-header {
      padding: 12px 14px;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #21262d;
      color: #e6edf3;
    }
    .counter {
      background: #30363d;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 12px;
    }
    .cards-container {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }
    .card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-title {
      font-size: 13px;
      color: #c9d1d9;
      font-weight: 500;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 11px;
    }
    .badge {
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 11px;
    }
    .badge-techdebt {
      background: #da3633;
      color: #fff;
    }
    .badge-enhancement {
      background: #1f6feb;
      color: #fff;
    }
    .badge-estimate {
      background: #238636;
      color: #fff;
    }
    .badge-sprint {
      background: #8957e5;
      color: #fff;
    }
    .issue-num {
      color: #8b949e;
      font-size: 12px;
    }
  </style>
</head>

    const root = document.getElementById("tasks-root");

    tasks.forEach(t => {
      const container = document.createElement("div");
      container.className = "task-container";

      const header = document.createElement("div");
      header.className = "task-header";
      header.innerHTML = `
        <div class="task-title">${t.title}</div>
        <button class="btn-download" onclick="downloadBoard('${t.id}', '${t.filename}')">📥 Download PNG (${t.filename})</button>
      `;

      const board = document.createElement("div");
      board.className = "kanban-board";
      board.id = t.id;

      t.columns.forEach(col => {
        const colDiv = document.createElement("div");
        colDiv.className = "kanban-column";

        colDiv.innerHTML = `
          <div class="column-header">
            <span>${col.name}</span>
            <span class="counter">${col.cards.length}</span>
          </div>
          <div class="cards-container">
            ${col.cards.map(c => `
              <div class="card">
                <span class="issue-num">${c.num}</span>
                <span class="card-title">${c.title}</span>
                ${c.badges && c.badges.length ? `
                  <div class="card-meta">
                    ${c.badges.map(b => `<span class="badge ${b.cls}">${b.text}</span>`).join("")}
                  </div>
                ` : ""}
              </div>
            `).join("")}
          </div>
        `;
        board.appendChild(colDiv);
      });

      container.appendChild(header);
      container.appendChild(board);
      root.appendChild(container);
    });

    function downloadBoard(boardId, filename) {
      const elem = document.getElementById(boardId);
      html2canvas(elem, { backgroundColor: "#010409", scale: 2 }).then(canvas => {
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = filename;
        a.click();
      });
    }
